<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titre %}Carnet de Contacts{% endblock %}</title>
    <!-- Bootstrap 5 pour le style -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Icônes Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background: linear-gradient(135deg, #1a73e8, #0d47a1); }
        .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-radius: 12px; }
        .btn-primary { background: #1a73e8; border-color: #1a73e8; }
        .avatar {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold; font-size: 1.1rem;
        }
    </style>
</head>
<body>

<!-- Barre de navigation -->
<nav class="navbar navbar-dark px-4 py-3">
    <a class="navbar-brand fw-bold fs-5" href="{% url 'liste_contacts' %}">
        <i class="bi bi-person-lines-fill me-2"></i>Carnet de Contacts
    </a>
    <a href="{% url 'ajouter_contact' %}" class="btn btn-light btn-sm">
        <i class="bi bi-plus-lg me-1"></i>Nouveau contact
    </a>
</nav>

<div class="container py-4">

    <!-- Messages flash (succès, erreur) -->
    {% for message in messages %}
    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}success{% endif %} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}

    {% block contenu %}{% endblock %}

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
