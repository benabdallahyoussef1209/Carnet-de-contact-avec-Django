{% extends 'contacts/base.html' %}

{% block titre %}Supprimer {{ contact }}{% endblock %}

{% block contenu %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card border-danger">
            <div class="card-body text-center p-5">
                <i class="bi bi-exclamation-triangle-fill text-danger display-3 mb-3"></i>
                <h4 class="fw-bold">Confirmer la suppression</h4>
                <p class="text-muted mb-4">
                    Voulez-vous vraiment supprimer le contact
                    <strong>{{ contact }}</strong> ?
                    Cette action est <strong>irréversible</strong>.
                </p>

                <!-- POST pour supprimer -->
                <form method="POST" action="" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger me-2">
                        <i class="bi bi-trash me-1"></i>Oui, supprimer
                    </button>
                </form>

                <a href="{% url 'detail_contact' contact.pk %}" class="btn btn-outline-secondary">
                    Annuler
                </a>
            </div>
        </div>

    </div>
</div>

{% endblock %}
